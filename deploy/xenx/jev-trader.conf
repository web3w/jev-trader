server {
    listen 8081;
    listen 443 ssl http2;
    server_name jev-trader.com www.jev-trader.com;

    # 1Panel's jev-trader.com.conf forwards port 80 to 8081; this file manages TLS separately.
    ssl_certificate /www/sites/jev-trader.com/letsencrypt/live/jev-trader.com/fullchain.pem;
    ssl_certificate_key /www/sites/jev-trader.com/letsencrypt/live/jev-trader.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/jev-trader-access.log;
    error_log /var/log/nginx/jev-trader-error.log;

    # Keep challenges separate from certificates; share this path across HTTP and HTTPS for renewal redirects.
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/jev-trader.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location /api/ {
        # Strip the /api prefix, preserve market query parameters and stream SSE immediately.
        proxy_pass http://127.0.0.1:8120/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Serve www HTTP and certificate challenges separately; 1Panel still manages port 80 for the apex domain.
server {
    listen 80;
    server_name www.jev-trader.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/jev-trader.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.jev-trader.com$request_uri;
    }
}
